name: Build

on:
  workflow_call:

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'npm'
    - run: npm ci --no-fund
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    - run: npm run build
    - uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: packages/*/lib
        retention-days: 1
